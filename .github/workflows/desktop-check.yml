name: Desktop check

on:
  pull_request:
  push:
    branches:
      - cursor/obs-replay-prototype-a23e

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-24.04
          - name: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev pkg-config build-essential libssl-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test TypeScript
        run: npm test

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build frontend
        run: npm run build

      - name: Build Rust
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
